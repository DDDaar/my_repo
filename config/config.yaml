model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  # base_model: "/home/ma-user/work/lbx/models/Qwen2.5-VL-7B-Instruct"
  hidden_size: 2048

data:
  # === 模式选择 ===
  # "single": 使用下方的 dataset_name/split/image_folder/feature_dir 进行单数据集训练
  # "mix": 使用 mix_datasets 列表进行混合训练
  train_mode: "single"  
  seed: 42  # 数据采样和打乱的随机种子

  # === 单数据集模式配置 (当 train_mode: "single" 时生效) ===
  dataset_name: "derek-thomas/ScienceQA"
  dataset_split: "train"
  count: -1
  image_folder: " "
  feature_dir: "./data/data_preprocessed/ScienceQA/aligned_features_ScienceQA_train"

  # === 混合数据集模式配置 (当 train_mode: "mix" 时生效) ===
  mix_datasets:
    - name: "derek-thomas/ScienceQA"
      split: "train"
      count: 100        # 采样数量，-1 表示全量
      image_folder: " "
      feature_dir: "./data/data_preprocessed/ScienceQA/aligned_features_ScienceQA_train"

    - name: "Xkev/LLaVA-CoT-100k"
      split: "train"
      count: 100
      image_folder: "/home/ma-user/work/lbx/dataset/LLaVA-CoT-100k"
      feature_dir: "./data/data_preprocessed/LLaVA-CoT-100k/aligned_features_LLaVA-CoT-100k_train"

    - name: "LightChen2333/M3CoT"
      split: "train"
      count: 100
      image_folder: " "
      feature_dir: ""
tokens:
  extract_token: "<|vision_extract_pad|>"
  extract_count: 0
  # [新增] 引导 Extract 阶段的前缀
  extract_text_prefix: " Let's extract global visual information: "

reasoning_stages:
  - name: "semantic"
    token: "<|dino_pad|>"
    count: 4
    feature_key: "dino_v2_global"
    dim: 768
    text_prefix: " Then analyze the semantic features: "
    
  - name: "structure"
    token: "<|depth_pad|>"
    count: 4
    feature_key: "depth_map_encoded"
    dim: 768 
    text_prefix: " Next, looking at the depth structure: "
    
  - name: "boundaries"
    token: "<|seg_pad|>"
    count: 4
    feature_key: "segmentation_map_encoded"
    dim: 512
    text_prefix: " Finally, observing the segmentation boundaries: "

training:
  epochs: 1
  alpha_sft: 1.0     # 基础生成 Loss
  beta_mse: 0.2      # 隐层对齐 Loss
  lambda_vbc: 0.2    # VBC 对比 Loss
  vbc_margin: 0.5    # VBC 动态权重阈值
  
  batch_size: 4
  learning_rate: 5e-5
  gradient_checkpointing: True