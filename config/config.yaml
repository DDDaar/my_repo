model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  hidden_size: 2048


data:
  # # 切换数据集: "derek-thomas/ScienceQA" 或 "LightChen2333/M3CoT"
  # dataset_name: "derek-thomas/ScienceQA"
  # # 数据集 split: "train", "validation", "test"
  # dataset_split: "train"

  # 切换数据集: "Xkev/LLaVA-CoT-100k"
  dataset_name: "Xkev/LLaVA-CoT-100k"
  
# === 数据集 Split 设置 ===
  # 模式 A: 全量训练
  # dataset_split: "train"
  # 模式 B: 快速验证 (仅使用前1000条)
  dataset_split: "train"

  # === 新增：图片根目录 ===
  # LLaVA-CoT 的 image 字段通常是相对路径 (如 "coco/train2017/xxxx.jpg")
  # 请将此路径修改为你本地存放这些图片的真实根目录
  # 如果数据集会自动加载 PIL (如 ScienceQA)，此字段会被忽略，但建议保留以防万一
  image_folder: "/home/ma-user/.cache/huggingface/hub/LLaVA-CoT-100k"


tokens:
  extract_token: "<|vision_extract_pad|>"
  extract_count: 16 

reasoning_stages:
  - name: "semantic"
    token: "<|dino_pad|>"
    count: 8
    feature_key: "dino_v2_global"
    dim: 768
    
  - name: "structure"
    token: "<|depth_pad|>"
    count: 8
    feature_key: "depth_map_encoded"
    dim: 768 
    
  - name: "boundaries"
    token: "<|seg_pad|>"
    count: 8
    feature_key: "segmentation_map_encoded"
    dim: 512

training:
  epochs: 1       # LLaVA 数据量较大，建议先跑 1 epoch
  alpha_sft: 1.0
  beta_mse: 2.0
  batch_size: 2   # CoT 文本较长，显存占用高，建议调小 BS
  learning_rate: 1e-4
  gradient_checkpointing: True

attention_control:
  image_visible_to:
    - "extract_token"
    - "reasoning_tokens"




