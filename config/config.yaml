model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  hidden_size: 2560

tokens:
  extract_token: "<|vision_extract_pad|>"
  extract_count: 16 # 提取层分配 16 个 Token 用于压缩视觉信息

# 推理对齐阶段 (MSE Loss)
reasoning_stages:
  - name: "semantic"
    token: "<|dino_pad|>"
    count: 8
    feature_key: "dino_v2_global"
    dim: 768
    
  - name: "structure"
    token: "<|depth_pad|>"
    count: 8
    feature_key: "depth_map_encoded"
    dim: 768
    
  - name: "boundaries"
    token: "<|seg_pad|>"
    count: 8
    feature_key: "segmentation_map_encoded"
    dim: 512

training:
  alpha_sft: 1.0
  beta_mse: 2.0
  batch_size: 4
  learning_rate: 1e-4

# 注意力控制：定义谁能看图片
attention_control:
  image_visible_to:
    - "extract_token"
    - "reasoning_tokens" 
    # explicitly EXCLUDE "text_tokens" (Question/Answer)