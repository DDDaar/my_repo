model:
  base_model: "Qwen/Qwen2.5-VL-7B-Instruct"
  hidden_size: 2048

data:
  # === 模式选择 ===
  # "single": 使用 dataset_name 单数据集
  # "mix": 使用 mix_datasets 混合数据集
  train_mode: "single"  
  seed: 42
  
  # [新增] 是否要求必须有对齐特征文件
  # true: 严格模式，跳过无特征文件的样本 (旧行为)
  # false: 混合模式，保留无特征样本，对其只计算 Text SFT Loss，不计算 MSE/VBC
  require_vision_features: true
  # # === 单数据集配置 ===
  # dataset_name: "LightChen2333/M3CoT"
  # dataset_split: "test"
  # count: -1
  # image_folder: " "
  # feature_dir: "./data/data_preprocessed/M3CoT/aligned_features_M3CoT_test"


  # === 单数据集配置 ===
  dataset_name: "derek-thomas/ScienceQA"
  dataset_split: "train"
  count: -1
  image_folder: " "
  feature_dir: "./data/data_preprocessed/ScienceQA/aligned_features_ScienceQA_train"

  # === 混合数据集配置 ===
  mix_datasets:
    - name: "derek-thomas/ScienceQA"
      split: "train"
      count: -1
      image_folder: " "
      feature_dir: "./data/data_preprocessed/ScienceQA/aligned_features_ScienceQA_train"

    - name: "Xkev/LLaVA-CoT-100k"
      split: "train"
      count: -1
      image_folder: "/home/ma-user/work/lbx/dataset/LLaVA-CoT-100k"
      feature_dir: "./data/data_preprocessed/LLaVA-CoT-100k/aligned_features_LLaVA-CoT-100k_train"

    - name: "LightChen2333/M3CoT"
      split: "train"
      count: -1
      image_folder: " "
      feature_dir: "./data/data_preprocessed/M3CoT/aligned_features_M3CoT_train"

tokens:
  # Extract 阶段 Token
  extract_token: "<|vision_extract_pad|>"
  extract_count: 0
  extract_text_prefix: " Let's extract global visual information: "

  # 结构性标签
  think_start: "<think>"
  think_end: "</think>"
  answer_start: "<answer>"
  answer_end: "</answer>"
  anchor_start: "<|anchor_start|>"
  anchor_end: "<|anchor_end|>"
  use_anchor: false

reasoning_stages:
  - name: "semantic"
    token: "<|dino_pad|>"
    count: 0
    feature_key: "dino_v2_global"
    dim: 768
    text_prefix: " Then analyze the semantic features: "
    
  - name: "structure"
    token: "<|depth_pad|>"
    count: 0
    feature_key: "depth_map_encoded"
    dim: 768 
    text_prefix: " Next, looking at the depth structure: "
    
  - name: "boundaries"
    token: "<|seg_pad|>"
    count: 0
    feature_key: "segmentation_map_encoded"
    dim: 512
    text_prefix: " Finally, observing the segmentation boundaries: "

training:
# [新增] 调试打印频率，设置 > 0 即可开启，例如 100 代表每 100 步打印一次
  debug_print_steps: 50

  epochs: 10
  alpha_sft: 1.0     
  beta_mse: 0.1      
  lambda_vbc: 0.0    
  vbc_margin: 0.6    

  batch_size: 2
  learning_rate: 1e-7
  gradient_checkpointing: True

  # 计算 VBC Loss 的范围: "answer" (仅最终答案) 或 "full" (全部回复)
  vbc_target_scope: "answer"