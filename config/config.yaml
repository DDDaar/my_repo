model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  hidden_size: 2048

data:
  # === 模式选择 ===
  # "single": 使用下方的 dataset_name/split/image_folder/feature_dir 进行单数据集训练
  # "mix": 使用 mix_datasets 列表进行混合训练
  train_mode: "single"  
  seed: 42  # 数据采样和打乱的随机种子

  # === 单数据集模式配置 (当 train_mode: "single" 时生效) ===
  dataset_name: "derek-thomas/ScienceQA"
  dataset_split: "train"
  image_folder: " "
  feature_dir: "./data/data_preprocessed/ScienceQA/aligned_features_ScienceQA_train"

  # === 混合数据集模式配置 (当 train_mode: "mix" 时生效) ===
  mix_datasets:
    # - name: "derek-thomas/ScienceQA"
    #   split: "train"
    #   count: 1000        # 采样数量，-1 表示全量
    #   image_folder: " "
    #   feature_dir: "./data/data_preprocessed/ScienceQA/aligned_features_ScienceQA_train"

    # - name: "Xkev/LLaVA-CoT-100k"
    #   split: "train"
    #   count: 500
    #   image_folder: "/home/ma-user/.cache/huggingface/hub/LLaVA-CoT-100k"
    #   feature_dir: "./data/data_preprocessed/LLaVA-CoT-100k/aligned_features_LLaVA-CoT-100k_train"

    - name: "LightChen2333/M3CoT"
      split: "train"
      count: 500
      image_folder: " "
      feature_dir: "./data/data_preprocessed/M3CoT/aligned_features_M3CoT_train"


tokens:
  extract_token: "<|vision_extract_pad|>"
  extract_count: 16 

reasoning_stages:
  - name: "semantic"
    token: "<|dino_pad|>"
    count: 8
    feature_key: "dino_v2_global"
    dim: 768
    
  - name: "structure"
    token: "<|depth_pad|>"
    count: 8
    feature_key: "depth_map_encoded"
    dim: 768 
    
  - name: "boundaries"
    token: "<|seg_pad|>"
    count: 8
    feature_key: "segmentation_map_encoded"
    dim: 512

training:
  epochs: 1
  alpha_sft: 1.0
  beta_mse: 0.2
  batch_size: 1
  learning_rate: 1e-4
  gradient_checkpointing: True

# === 注意力控制 ===
# 决定哪些 Token 可以在 Attention Mask 中看到原始 Image Token
# extract_token: 隐式特征提取 Token
# reasoning_tokens: 各个阶段的推理 Token
# answer: 最终生成的答案
attention_control:
  image_visible_to:
    - "extract_token"
    - "reasoning_tokens"
    # - "answer" # 如果注释掉，则 Answer 阶段无法直接 Attend 到图片，必须依赖推理 Token