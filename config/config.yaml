model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  hidden_size: 2560

tokens:
  extract_token: "<|vision_extract_pad|>"
  extract_count: 16 

reasoning_stages:
  - name: "semantic"
    token: "<|dino_pad|>"
    count: 8
    feature_key: "dino_v2_global"
    dim: 768
    
  - name: "structure"
    token: "<|depth_pad|>"
    count: 8
    feature_key: "depth_map_encoded"
    dim: 768 # 请确认这与你预处理时的特征维度一致(Base:768, Small:384)
    
  - name: "boundaries"
    token: "<|seg_pad|>"
    count: 8
    feature_key: "segmentation_map_encoded"
    dim: 512

training:
  alpha_sft: 1.0
  beta_mse: 2.0
  batch_size: 1
  learning_rate: 1e-4
  gradient_checkpointing: True # 建议开启，用时间换空间，避免OOM

attention_control:
  image_visible_to:
    - "extract_token"
    - "reasoning_tokens"