model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  hidden_size: 2048

data:
  # 切换数据集: "derek-thomas/ScienceQA" 或 "LightChen2333/M3CoT"
  dataset_name: "derek-thomas/ScienceQA"
  # 数据集 split: "train", "validation", "test"
  dataset_split: "train"

tokens:
  extract_token: "<|vision_extract_pad|>"
  extract_count: 16 

reasoning_stages:
  - name: "semantic"
    token: "<|dino_pad|>"
    count: 8
    feature_key: "dino_v2_global"
    dim: 768
    
  - name: "structure"
    token: "<|depth_pad|>"
    count: 8
    feature_key: "depth_map_encoded"
    dim: 768 
    
  - name: "boundaries"
    token: "<|seg_pad|>"
    count: 8
    feature_key: "segmentation_map_encoded"
    dim: 512

training:
  epochs: 2       
  alpha_sft: 1.0
  beta_mse: 2.0
  batch_size: 4 # M3CoT 文本较长，可能需要调小 batch
  learning_rate: 1e-4
  gradient_checkpointing: True

attention_control:
  image_visible_to:
    - "extract_token"
    - "reasoning_tokens"